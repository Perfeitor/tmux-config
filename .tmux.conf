# My tmux configuration, partly based on https://github.com/wbkang/wbk-stow/blob/master/tmux-config/.tmux.conf

# Scroll History
set -g history-limit 50000

# show messages for 4 seconds instead
set -g display-time 4000

# set first window to index 1 (not 0) to map more to the keyboard layout
set-option -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1

# Make mouse useful, tmux > 2.1 include select, resize pane/window and console wheel scroll
set -g mouse on

# Lower escape timing from 500ms to 50ms for quicker response to scroll-buffer access.
set -s escape-time 50


## Clipboard integration
# ctrl+c to send to clipboard
bind C-c run "tmux save-buffer - | xclip -i -sel clipboard"
# ctrl+v to paste from clipboard
bind C-v run "tmux set-buffer \"$(xclip -o -sel clipboard)\"; tmux paste-buffer"

# Selection with mouse should copy to clipboard right away, in addition to the default action.
unbind -n -Tcopy-mode-vi MouseDragEnd1Pane
bind -Tcopy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel\; run "tmux save-buffer - | xclip -i -sel clipboard > /dev/null"


# Middle click to paste from the clipboard
unbind-key MouseDown2Pane
bind-key -n MouseDown2Pane run "tmux set-buffer \"$(xclip -o -sel clipboard)\"; tmux paste-buffer"

# Drag to re-order windows
bind-key -n MouseDrag1Status swap-window -t=

# Double click on the window list to open a new window
bind-key -n DoubleClick1Status new-window

set -g default-terminal "tmux-256color"

set -g @catppuccin_flavor 'macchiato'
set -g @catppuccin_window_status_style 'basic'

set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""

set -g automatic-rename on
set -g allow-rename on

set -g window-style 'bg=default'
set -g window-active-style 'bg=default'


## Plugins (TPM)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'
set -g @plugin 'tmux-plugins/tmux-cpu'

# Initialize TMUX plugin manager. Keep this line at the very bottom of tmux.conf.
run '~/.tmux/plugins/tpm/tpm'


## Status bar (built after TPM loads catppuccin)
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_ram}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -g @catppuccin_date_time_text " %d/%m/%y %H:%M"
set -agF status-right "#{E:@catppuccin_status_date_time}"

# tmux-cpu interpolation (replaces #{cpu_percentage} etc. embedded above)
run '~/.tmux/plugins/tmux-cpu/cpu.tmux'

# Restore tmux sau reboot
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Khôi phục OpenCode đúng session
set -g @plugin 'guysoft/tmux-resurrect-opencode-sessions'

# Tự động restore
set -g @continuum-restore 'on'

# Lưu mỗi 5 phút
set -g @continuum-save-interval '5'

# Khôi phục nội dung pane
set -g @resurrect-capture-pane-contents 'on'

# TPM
run '~/.tmux/plugins/tpm/tpm'
