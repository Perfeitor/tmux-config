# tmux configuration
# Partly based on https://github.com/wbkang/wbk-stow/blob/master/tmux-config/.tmux.conf

## ---------------------------------------------------------------------------
## General
## ---------------------------------------------------------------------------

# Scroll-back history
set -g history-limit 50000

# Show messages for 4 seconds instead of the default
set -g display-time 4000

# Start window/pane indexes at 1 to better match the keyboard layout
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1

# Mouse: select, resize pane/window and wheel scroll
set -g mouse on

# Lower escape timing from 500ms to 50ms for quicker scroll-buffer access
set -s escape-time 50

set -g default-terminal "tmux-256color"

# WSL: long-lived servers keep a stale WSL_INTEROP after WSL creates a new
# interop socket, which makes clip.exe/powershell silently fail to reach the
# Windows clipboard. Refresh it from the attaching client's environment.
set -ga update-environment " WSL_INTEROP"

## ---------------------------------------------------------------------------
## Window / pane
## ---------------------------------------------------------------------------

# Let applications (OpenCode, nvim, ...) drive pane/window titles
set -g automatic-rename on
set -g allow-rename on

set -g window-style 'bg=default'
set -g window-active-style 'bg=default'

## ---------------------------------------------------------------------------
## Mouse bindings
## ---------------------------------------------------------------------------

# Drag on the status line to re-order windows
bind-key -n MouseDrag1Status swap-window -t=

# Double click on the window list to open a new window
bind-key -n DoubleClick1Status new-window

## ---------------------------------------------------------------------------
## Clipboard (portable: WSL / macOS / Linux, no xclip dependency)
## ---------------------------------------------------------------------------

set -g set-clipboard off

# ctrl+c: tmux buffer -> OS clipboard
bind C-c run "tmux save-buffer - | ~/tmux-config/scripts/clipboard.sh copy"

# ctrl+v: OS clipboard -> tmux
bind C-v run "tmux set-buffer \"$(~/tmux-config/scripts/clipboard.sh paste)\"; tmux paste-buffer"

# Mouse drag in copy-mode: copy selection to OS clipboard and cancel.
# Key table must match mode-keys (emacs by default -> copy-mode).
bind -Tcopy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel "~/tmux-config/scripts/clipboard.sh copy"

# Middle click: paste from the OS clipboard
unbind-key -n MouseDown2Pane
bind-key -n MouseDown2Pane run "tmux set-buffer \"$(~/tmux-config/scripts/clipboard.sh paste)\"; tmux paste-buffer"

## ---------------------------------------------------------------------------
## Plugins (TPM)
## ---------------------------------------------------------------------------

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'guysoft/tmux-resurrect-opencode-sessions'

# Theme options (must be set before TPM loads catppuccin)
set -g @catppuccin_flavor 'macchiato'
set -g @catppuccin_window_status_style 'basic'
set -g @catppuccin_date_time_text " %d/%m/%y %H:%M"

## ---------------------------------------------------------------------------
## Session persistence (resurrect + continuum + OpenCode sessions)
## ---------------------------------------------------------------------------

# Auto-restore layout/sessions when the tmux server starts
set -g @continuum-restore 'on'

# Auto-save interval in minutes
set -g @continuum-save-interval '5'

# Do not restore pane contents (avoids stale TUI screens from exited apps)
set -g @resurrect-capture-pane-contents 'off'

# Reset the OpenCode post-save hook on every load so it is not chained twice
set -gu @resurrect-hook-post-save-layout

# Force TUIs (nvim, opencode, ...) to redraw at the correct size after restore
set -g @resurrect-hook-post-restore-all '~/tmux-config/scripts/redraw_tui_after_restore.sh'

## ---------------------------------------------------------------------------
## Status bar
## ---------------------------------------------------------------------------

set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""

# Load TPM first so catppuccin defines the @catppuccin_status_* options that
# the status bar below expands.
run '~/.tmux/plugins/tpm/tpm'

# Build the status bar after TPM has loaded catppuccin
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_ram}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_date_time}"

# Re-add the tmux-continuum auto-save trigger. TPM injects it into status-right
# at load time, but rebuilding the status bar above overwrites it, which
# silently disables auto-save. The status bar runs this script on every
# refresh; it only saves once the interval has elapsed.
set -ag status-right "#($HOME/.tmux/plugins/tmux-continuum/scripts/continuum_save.sh)"

# tmux-cpu interpolation (must run after the status bar contains its modules)
run '~/.tmux/plugins/tmux-cpu/cpu.tmux'
